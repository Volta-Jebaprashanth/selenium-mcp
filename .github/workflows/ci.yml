name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # JDK modules the server jar needs (from `jdeps --print-module-deps` over the fat jar),
  # plus jdk.crypto.cryptoki, jdk.zipfs and jdk.charsets as headroom for TLS, zip and
  # charset lookups that jdeps can't see. If a dependency bump needs another module, the
  # smoke tests in the bundle job fail - add it here.
  JLINK_MODULES: java.base,java.compiler,java.desktop,java.instrument,java.naming,java.net.http,java.prefs,java.scripting,java.security.jgss,java.sql,jdk.jfr,jdk.management,jdk.net,jdk.unsupported,jdk.crypto.cryptoki,jdk.zipfs,jdk.charsets

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build
        run: mvn -B clean package

      # Unit tests already ran in the Build step; this adds the tests that drive the Chrome
      # preinstalled on the runner. A failure here after a runner image update usually means
      # Chrome has outpaced the pinned Selenium's CDP support - bump selenium.version.
      - name: Test against headless Chrome
        run: mvn -B test -Dselenium.it=true

      - name: Determine release version
        id: version
        run: |
          RAW_VERSION=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          BASE_VERSION=${RAW_VERSION%-SNAPSHOT}
          echo "version=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: selenium-mcp-jar
          path: target/*.jar
          if-no-files-found: error

  # Builds a trimmed Java runtime per OS/CPU and packs it with the jar into the
  # @xpathy/selenium-mcp-<platform>-<arch> npm package. Runs on pull requests too, so a
  # change that breaks the bundled runtime is caught before it reaches main.
  bundle:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win32-x64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download jar artifact
        uses: actions/download-artifact@v8
        with:
          name: selenium-mcp-jar
          path: pkg

      - name: Build runtime with jlink
        run: |
          "$JAVA_HOME/bin/jlink" \
            --add-modules "$JLINK_MODULES" \
            --strip-debug --no-man-pages --no-header-files --compress=zip-6 \
            --output pkg/runtime

      - name: Create platform package
        run: |
          node npm/scripts/make-platform-package.js "${{ needs.build.outputs.version }}" pkg
          node -e "const p=require('./pkg/package.json'); if (!p.name.endsWith('${{ matrix.target }}')) { console.error('Built ' + p.name + ' on a ${{ matrix.target }} runner'); process.exit(1); }"

      - name: Smoke test the bundled runtime
        run: node npm/scripts/smoke-test.js pkg/runtime/bin/java -jar pkg/selenium-mcp.jar

      - name: Pack
        run: |
          mkdir -p tarballs
          (cd pkg && npm pack --pack-destination ../tarballs)
          ls -la tarballs

      - name: Smoke test the launcher against the packed package
        run: |
          # Lay the packages out the way npm installs them, then start the server through
          # the launcher - this exercises the packed files, not the build directory.
          mkdir -p launcher-test/node_modules/@xpathy
          cp -r npm/selenium-mcp "launcher-test/node_modules/@xpathy/selenium-mcp"
          tar -xzf tarballs/*.tgz -C launcher-test
          mv launcher-test/package "launcher-test/node_modules/@xpathy/selenium-mcp-${{ matrix.target }}"
          node launcher-test/node_modules/@xpathy/selenium-mcp/bin/selenium-mcp.js --version
          node npm/scripts/smoke-test.js node launcher-test/node_modules/@xpathy/selenium-mcp/bin/selenium-mcp.js

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          path: tarballs/*.tgz
          if-no-files-found: error

  release:
    needs: [build, bundle]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v8
        with:
          name: selenium-mcp-jar
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: dist/**/*.jar

  # Publishes the platform packages first and the launcher last, and waits until the
  # registry actually serves each platform version before publishing the launcher: npm
  # processes large uploads asynchronously (the first publish took ~10 minutes), and an
  # `npx` that resolves the launcher before its runtime is servable caches an install
  # without one. Already-published versions are skipped, so a failed run can be re-run.
  #
  # Authenticates with npm trusted publishing (GitHub OIDC; needs npm >= 11.5.1 and the
  # id-token permission). The NPM_TOKEN secret is only a fallback until trusted publishing
  # is configured on npmjs.com for every @xpathy package; delete the secret afterwards.
  publish-npm:
    needs: [build, bundle, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing + provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download npm packages
        uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: tarballs
          merge-multiple: true

      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          is_live() { # <name> - true once the registry serves <name>@$VERSION
            npm view "$1@$VERSION" version --prefer-online >/dev/null 2>&1
          }

          publish() { # <name> <path-or-tarball>
            if is_live "$1"; then
              echo "$1@$VERSION already published - skipping"
            else
              npm publish "$2" --access public --provenance
            fi
          }

          wait_until_live() { # <name>
            for _ in $(seq 1 90); do
              if is_live "$1"; then
                echo "$1@$VERSION is live"
                return 0
              fi
              sleep 20
            done
            echo "::error::$1@$VERSION still not served by the registry after 30 minutes - not publishing the launcher. Re-run this job once it is."
            return 1
          }

          # The ./ prefix matters: npm reads a bare "dir/file.tgz" as GitHub "user/repo" shorthand.
          platform_packages=()
          for tarball in ./tarballs/*.tgz; do
            name=$(tar -xzOf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")
            publish "$name" "$tarball"
            platform_packages+=("$name")
          done

          for name in "${platform_packages[@]}"; do
            wait_until_live "$name"
          done

          node npm/scripts/set-version.js "$VERSION"
          publish "@xpathy/selenium-mcp" ./npm/selenium-mcp
