spring.main.web-application-type=none
spring.main.banner-mode=off
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=selenium-mcp-java
spring.ai.mcp.server.version=@project.version@
# Sent to clients on connect; many put it in the agent's system prompt.
spring.ai.mcp.server.instructions=This server is a test automation tool for the Selenium + Java ecosystem, not a \
  general browser automation tool: it drives a real browser with Selenium so you can explore a web app and write or \
  maintain Selenium Java tests for it. Treat every step as a step of the test you will write - use Selenium locators, \
  explicit waits on conditions, never Thread.sleep - and prefer the project's existing test utilities. By default a session behaves like plain Selenium (no implicit wait, nothing \
  waited for after actions), so what passes here passes in the generated test; the one wait it makes on its own, a \
  click retrying while its target is covered, is reported when it happens. \
  When you open a browser, set the wait strategy to match the target framework (openBrowser's wait parameters, or \
  setAutoWait). Action results say when a step set off requests or animations, or had to wait for a covering \
  element, and which wait the generated test needs there. Before writing test code, call getWaitReport (which \
  steps need a wait) and getWaitCodeSnippets (the Java for those waits).

logging.pattern.console=
logging.file.name=mcp-server.log
