name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build
        run: mvn -B clean package

      - name: Test
        run: mvn -B test

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-mcp-jar
          path: target/*.jar
          if-no-files-found: error
